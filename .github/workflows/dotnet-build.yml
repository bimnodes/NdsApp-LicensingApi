name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Supabase migration governance
        run: python3 -m unittest scripts/test_validate_supabase_migrations.py

      - name: Validate Supabase migration changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          python3 scripts/validate_supabase_migrations.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NdsApp.LicensingApi/NdsApp.LicensingApi.csproj

      - name: Build
        run: dotnet build src/NdsApp.LicensingApi/NdsApp.LicensingApi.csproj --configuration Release --no-restore
